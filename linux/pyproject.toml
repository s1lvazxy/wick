[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wick-linux"
version = "0.3.0"
description = "Close the lid. Keep working. Keeps a Linux laptop awake with the lid closed, for coding agents and long builds."
readme = "README.md"
authors = [{ name = "s1lvazxy" }, { name = "gust330" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Power (UPS)",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://s1lvazxy.github.io/wick/"
Source = "https://github.com/s1lvazxy/wick"

[project.scripts]
wick = "wick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wick = ["assets/*", "assets/*/*", "assets/*/*/*"]
